services:
  screengate:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SCREENGATE_LOG_PATH: /data/audit.log
      SCREENGATE_CHROMA_PATH: /data/chroma
    volumes:
      - screengate-data:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - screengate

volumes:
  screengate-data:
  caddy-data:
  caddy-config:
