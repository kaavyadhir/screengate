name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pydantic PyYAML pytest pypdf

      - name: Tests
        run: pytest -q

      # The benchmark runs on every push against the deterministic mock
      # target, so a change that quietly weakens a defense fails CI rather
      # than being discovered when someone re-reads the README.
      - name: Benchmark (offline, deterministic)
        env:
          SCREENGATE_PROVIDER: mock
          SCREENGATE_EMBEDDER: hashing
          SCREENGATE_VECTOR_STORE: memory
        run: python -m bench.runner --fail-under 95 --json bench/results_mock.json

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench/results_mock.json
