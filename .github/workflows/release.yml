# Build the container here, not on the server.
#
# The deployment target is a 1 GB free-tier instance. `docker compose
# build` there is slow at best and gets OOM-killed at worst, and a build
# that only ever runs on one machine is also a build nobody can audit.
#
# So: GitHub builds the image, pushes it to GHCR, and the server does
# nothing but `docker compose pull && up -d`. Deploys become seconds,
# every image is traceable to a commit, and rolling back is pulling an
# older tag.
#
# Gated on CI: this only runs after the test workflow passes on main, so
# an image is never published from a commit whose defenses regressed.
name: Release image

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    # workflow_run fires whatever the outcome, so check it explicitly.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` is what the server pulls; the sha tag is what makes
          # a rollback possible and ties a running container to a commit.
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache in the registry so a dependency-only rebuild is quick.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy with: docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d" >> "$GITHUB_STEP_SUMMARY"
